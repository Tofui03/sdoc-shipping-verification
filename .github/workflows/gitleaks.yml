# .github/workflows/gitleaks.yml
# Scans every push and pull request for secrets + Malaysian business PII
# using the repo's .gitleaks.toml (default rules + BJ-POS custom rules).
name: gitleaks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so old commits are scanned too

      - name: Install gitleaks (pinned + checksum verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          rm gitleaks.tar.gz
          gitleaks version

      - name: Scan git history
        # --redact keeps any matched value out of the public Actions log.
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner --verbose --exit-code 1

      - name: Scan working tree (tracked files)
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner --exit-code 1

name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          cd frontend && npm ci

      - name: Build frontend and generate demo data
        env:
          VITE_BASE_PATH: /sdoc-shipping-verification/
        run: |
          cd frontend && npm run build
          cd ..
          python -c "
          from src.demo.uat_seed import seed_uat_demo_records
          from src.store.audit_store import AuditStore
          import json
          store = AuditStore()
          records = seed_uat_demo_records(store, 250)
          with open('docs/audit_records.json', 'w') as f:
              json.dump([r.model_dump(mode='json') for r in records], f)
          "
          cp docs/index.html docs/404.html

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
